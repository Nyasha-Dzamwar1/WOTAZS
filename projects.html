<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOTAZS • Projects</title>

  <!-- Tailwind -->
  <link href="dist/output.css" rel="stylesheet" />
</head>

<body class="bg-gray-50 page-loading">
  <div id="page-loader" class="page-loader" role="status" aria-live="polite" aria-label="Loading page" aria-busy="true">
    <div class="page-loader__content">
      <svg class="page-loader__icon" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <circle cx="32" cy="32" r="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="5"></circle>
        <path d="M32 7a25 25 0 0 1 25 25" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"></path>
      </svg>
      <p class="page-loader__brand">WOTAZS GROUP</p>
      <p class="page-loader__text">Your Dream, Our Duty</p>
    </div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main>

    <!-- HERO BANNER -->
    <section class="relative min-h-[400px] md:h-[380px] flex items-center overflow-hidden">
      <!-- Background -->
      <img
        src="assets/images/hero/hero.jpg"
        alt="Construction site"
        class="absolute inset-0 w-full h-full object-cover"
      />
      <div class="absolute inset-0 bg-black/60"></div>

      <!-- Content -->
      <div class="relative z-10 container mx-auto px-6 md:px-8 py-16">
        <p class="text-white/85 text-sm md:text-base tracking-widest mb-3">BUILDING EXCELLENCE WITH INTEGRITY</p>
        <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-8">OUR PROJECTS</h1>
        <ul class="text-white text-sm md:text-base space-y-2">
          <li class="flex items-center gap-3"><span class="block w-2 h-2 bg-darkGreen rounded-full flex-shrink-0"></span>Building Construction</li>
          <li class="flex items-center gap-3"><span class="block w-2 h-2 bg-darkGreen rounded-full flex-shrink-0"></span>Renovation &amp; Remodeling</li>
          <li class="flex items-center gap-3"><span class="block w-2 h-2 bg-darkGreen rounded-full flex-shrink-0"></span>Electrical Works</li>
          <li class="flex items-center gap-3"><span class="block w-2 h-2 bg-darkGreen rounded-full flex-shrink-0"></span>CCTV Installation</li>
          <li class="flex items-center gap-3"><span class="block w-2 h-2 bg-darkGreen rounded-full flex-shrink-0"></span>Plumbing</li>
          <li class="flex items-center gap-3"><span class="block w-2 h-2 bg-darkGreen rounded-full flex-shrink-0"></span>Quantity Surveying</li>
        </ul>
      </div>
    </section>

    <!-- PROJECTS GALLERY -->
    <section class="container mx-auto px-6 md:px-8 py-16 md:py-24">
      <div class="mb-12 md:mb-16">
        <h2 class="text-3xl md:text-4xl font-bold text-darkBlue tracking-tight">OUR PROJECTS</h2>
        <div class="w-24 h-1.5 bg-darkGreen rounded-full mt-4"></div>
      </div>

      <!-- Cards rendered by assets/js/projects.js -->
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-10"></div>
    </section>

  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- JS -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/projects.js"></script>
</body>
</html>
